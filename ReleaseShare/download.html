<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="twitter:card" content="summary_large_image">

    content="Native, signed, and notarized. One keystroke opens a grid, you choose a spot, the window is there."
  >

  <style>
    @font-face {
      font-family: "Fundamental Prose Display";
      src: url("DOWNLOAD_BASE_URL/assets/FundamentalProse-Display.woff2") format("woff2");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Fundamental Prose Subhead";
      src: url("DOWNLOAD_BASE_URL/assets/FundamentalProse-Subhead.woff2") format("woff2");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Fundamental Prose Text";
      src: url("DOWNLOAD_BASE_URL/assets/FundamentalProse-Text.woff2") format("woff2");
      font-weight: 400; font-style: normal; font-display: swap;
    }

    @layer base, page;

    @layer base {
      :root {
        color-scheme: light;

        --ink: #1E2430;
        --quiet: #5C6063;
        --faint: #5C6063;
        --paper: #F6F0E5;
        --accent: #2947B8;
        --edge: rgb(30 36 48 / 15%);

        --serif: "Fundamental Prose Text";
        --display: "Fundamental Prose Display";
        --subhead: "Fundamental Prose Subhead";
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;

        font-family: var(--serif);
        background: var(--paper);
        color: var(--ink);
        accent-color: var(--accent);
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        font-synthesis: none;
      }
    }

    @layer page {
      body {
        display: flex;
        min-height: 100svh;
        padding: clamp(18px, 4vh, 64px) clamp(20px, 6vw, 64px);
        background: var(--paper);
        overflow-x: hidden;
      }
      main {
        display: grid;
        justify-items: center;
        gap: min(clamp(14px, 2.2vw, 22px), 3.2vh);
        width: min(62ch, 100%);
        margin: auto;
        text-align: center;
        @starting-style { opacity: 0; translate: 0 14px; }
        opacity: 1;
        translate: none;
        transition: opacity 0.7s ease, translate 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .mark {
        width: min(clamp(76px, 12vw, 104px), 16vh);
        height: auto;
        border-radius: 24%;
        filter: drop-shadow(0 8px 20px rgb(30 36 48 / 14%));
      }
      h1 {
        max-width: 100%;
        color: var(--accent);
        font-family: var(--display);
        font-size: min(clamp(40px, 13.5vw, 104px), 15vh);
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 0.92;
        text-wrap: balance;
      }
      .lede {
        color: var(--quiet);
        font-family: var(--subhead);
        font-size: clamp(19px, 3vw, 26px);
        line-height: 1.35;
        text-wrap: balance;
      }
      .formats {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px 10px;
        padding: 0;
        list-style: none;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        li {
          padding: 6px 13px;
          border: 1px solid var(--edge);
          border-radius: 999px;
          color: var(--faint);
        }
        @media (width <= 600px) {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }
      }
      .get {
        display: inline-flex;
        place-items: center;
        gap: 9px;
        min-height: 52px;
        margin-top: clamp(8px, 1.5vw, 16px);
        padding-inline: 30px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        background: var(--accent);
        color: var(--paper);
        font-family: var(--mono);
        font-size: 15.5px;
        font-weight: 500;
        text-decoration: none;
        box-shadow: 0 10px 26px rgb(30 36 48 / 18%);
        transition: scale 0.2s ease, box-shadow 0.2s ease;
        &:hover { scale: 1.02; box-shadow: 0 14px 34px rgb(30 36 48 / 24%); }
        &:active { scale: 0.99; }
        &:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
      }
      .glyph { width: 1.15em; height: 1.15em; flex: none; }
      .back {
        position: fixed;
        top: clamp(14px, 2.4vh, 26px);
        left: clamp(16px, 3vw, 32px);
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--faint);
        font-family: var(--mono);
        font-size: 12.5px;
        text-decoration: none;
        transition: color 160ms ease;
      }
      .back:hover { color: var(--ink); }
      .back:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 2px; }
      @media (width <= 600px) {
        .back { position: static; justify-content: center; margin-bottom: 6px; }
      }
      .meta {
        color: var(--faint);
        font-family: var(--mono);
        font-size: 12.5px;
        letter-spacing: 0.02em;
      }
    }
  </style>
</head>
<body>
  <a class="back" href="https://fundamentalapplications.com">Fundamental Applications</a>
  <main>
    <img
      class="mark"
      src="DOWNLOAD_BASE_URL/assets/Regions-icon.svg"
      width="512"
      height="512"
      alt=""
    >
    <h1>Regions</h1>
    <p class="lede">Put a window where you want it.</p>
    <ul class="formats">
      <li>Grid</li>
      <li>Presets</li>
      <li>Displays</li>
      <li>Saved layouts</li>
    </ul>
    <a class="get" href="DOWNLOAD_BASE_URL/latest/Regions.dmg">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/>
      </svg>
      Download for macOS
    </a>
    <p class="meta">VERSION_LINE</p>
  </main>
</body>
</html>
