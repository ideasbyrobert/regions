name: Regions
options:
  bundleIdPrefix: com.ideasbyrobert
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  Release: release
# Kept in step with Package.swift by hand: SwiftPM builds the release, the
# generated project builds the tests, and when only one of them knew about
# Sparkle the test target could not compile the app at all.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
settings:
  # @testable import needs the app module compiled with -enable-testing, which is a Debug-only
  # setting and was never declared, so every test file failed to import Regions. Debug also builds
  # the active architecture alone: without it the module is emitted for arm64 and x86_64 while the
  # test destination is one of them, and the other reads as an incompatible target.
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
  base:
    ARCHS: "$(ARCHS_STANDARD)"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: X87D35HM5V
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
targets:
  Regions:
    type: application
    platform: macOS
    sources:
      - path: Sources/Regions
      - path: Resources/Regions.icon
        buildPhase: resources
    info:
      path: .derived/xcodegen/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.utilities
        LSMultipleInstancesProhibited: true
        LSUIElement: true
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "5"
        NSAppleEventsUsageDescription: Regions uses Terminal Automation only to set the selected tab in each Terminal window to 80 columns by 48 rows when you choose Arrange App Windows 4 × 2.
        SUFeedURL: https://downloads.ideasbyrobert.com/places/appcast.xml
        SUPublicEDKey: +vhVXgERIDkF9jUDCo/eorsxZ8NP52N+ILOpYHZCiKQ=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    dependencies:
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Resources/Regions.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Regions
        COMBINE_HIDPI_IMAGES: YES
        # Keep the established bundle identifier so existing installs can
        # receive this renamed Regions build through the same Sparkle feed.
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.Places
        PRODUCT_NAME: Regions
  WindowFixtureApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/WindowFixtureApp
    info:
      path: Resources/FixtureInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.Regions.WindowFixtureApp
        PRODUCT_NAME: WindowFixtureApp
  RegionsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/RegionsTests
    dependencies:
      - target: Regions
      - target: WindowFixtureApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Regions tests automate disposable Terminal windows only during the explicit live Terminal test.
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.RegionsTests
        PRODUCT_NAME: RegionsTests
        # A macOS unit test bundle resolves its symbols against the host executable, and needs
        # both halves to do it. TEST_HOST was set and BUNDLE_LOADER was not, so the bundle ran
        # against the app without linking it: every type the tests touch came back undefined.
        BUNDLE_LOADER: $(TEST_HOST)
  RegionsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/RegionsUITests
    dependencies:
      - target: Regions
      - target: WindowFixtureApp
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.RegionsUITests
        PRODUCT_NAME: RegionsUITests
schemes:
  Regions:
    build:
      targets:
        Regions: all
        WindowFixtureApp: [test]
        RegionsTests: [test]
        RegionsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RegionsTests
        - RegionsUITests
    archive:
      config: Release
  WindowFixtureApp:
    build:
      targets:
        WindowFixtureApp: all
    run:
      config: Debug
