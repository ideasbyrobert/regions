name: Regions
options:
  bundleIdPrefix: com.ideasbyrobert
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    ARCHS: "$(ARCHS_STANDARD)"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: X87D35HM5V
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
targets:
  Regions:
    type: application
    platform: macOS
    sources:
      - path: Sources/Regions
      - path: Resources/Regions.icon
        buildPhase: resources
    info:
      path: .derived/xcodegen/Info.plist
      properties:
        CFBundleDisplayName: Regions
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: 1
        LSApplicationCategoryType: public.app-category.utilities
        LSMultipleInstancesProhibited: true
        LSUIElement: true
        NSAppleEventsUsageDescription: Regions uses Terminal Automation only when you arrange multiple Terminal windows.
        NSSupportsAutomaticGraphicsSwitching: true
    entitlements:
      path: Resources/Regions.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Regions
        COMBINE_HIDPI_IMAGES: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.Regions
        PRODUCT_NAME: Regions
  WindowFixtureApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/WindowFixtureApp
    info:
      path: Resources/FixtureInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.Regions.WindowFixtureApp
        PRODUCT_NAME: WindowFixtureApp
  RegionsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/RegionsTests
    dependencies:
      - target: Regions
      - target: WindowFixtureApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Regions tests automate disposable Terminal windows only during the explicit live Terminal test.
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.RegionsTests
  RegionsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/RegionsUITests
    dependencies:
      - target: Regions
      - target: WindowFixtureApp
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.RegionsUITests
schemes:
  Regions:
    build:
      targets:
        Regions: all
        WindowFixtureApp: [test]
        RegionsTests: [test]
        RegionsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RegionsTests
        - RegionsUITests
    archive:
      config: Release
  WindowFixtureApp:
    build:
      targets:
        WindowFixtureApp: all
    run:
      config: Debug
